.ttl{font-weight:700;line-height:1.15}.ttl small{display:block;color:var(--muted);font-weight:500;font-size:.75rem}
.sp{flex:1}
button,input,select,textarea{font:inherit;color:inherit}
.btn{text-decoration:none;display:inline-block;color:var(--fg);border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--brand)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
:root[data-theme="dark"] .btn.p{color:#06161a}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.no{color:var(--bad);border-color:var(--bad)}
.btn.wa{background:#25d366;color:#06220f;border-color:#25d366}
.btn.sm{padding:6px 10px;font-size:.85rem}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:1px}
label{display:grid;gap:6px;font-weight:600;font-size:.85rem}
.login{max-width:380px;margin:12vh auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px;display:grid;gap:14px}
.login h1{margin:0;font-size:1.3rem}
.err{color:var(--bad);font-size:.85rem;min-height:1.2em}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:.88rem}
.chip b{margin-inline-start:6px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.chip[aria-pressed="true"] b{color:inherit;opacity:.85}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#06161a}
.tools{display:flex;gap:10px;margin-bottom:14px}
.list{display:grid;gap:12px;padding-bottom:60px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:10px}
.card.new{border-inline-start:4px solid var(--accent)}
.top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.nm{font-weight:700;font-size:1.05rem}
.meta{color:var(--muted);font-size:.85rem}
.badge{font-size:.75rem;font-weight:700;border-radius:99px;padding:3px 10px;border:1px solid currentColor}
.s-new{color:var(--accent)}.s-review{color:var(--warn)}.s-quoted{color:var(--brand)}.s-approved{color:var(--ok)}.s-rejected{color:var(--bad)}.s-done{color:var(--muted)}
.route{font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 16px}
.kv small{display:block;color:var(--muted);font-size:.75rem}
.kv span{overflow-wrap:anywhere}
.more{display:grid;gap:12px;border-top:1px dashed var(--line);padding-top:12px}
.row{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.empty{text-align:center;color:var(--muted);padding:60px 0}
.note{font-size:.8rem;color:var(--muted)}
@media (max-width:560px){.row{grid-template-columns:1fr}.ttl small{display:none}}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;opacity:0;pointer-events:none;transition:.2s}
.toast.on{opacity:1}
</style>

 phone:"الهاتف",mail:"البريد",company:"الشركة",notes:"ملاحظات العميل",files:"الملفات (اطلبها عبر واتساب)",status:"الحالة",quote:"عرض السعر",quote_ph:"مثال: 2,400 دولار شامل",anote:"ملاحظة داخلية (خاصة)",
 save:"حفظ",approve:"موافقة",reject:"رفض",wa:"رد عبر واتساب",mailr:"رد بالبريد",copy:"نسخ",del:"حذف",saved:"تم الحفظ",copied:"تم النسخ",confirm:"حذف هذا الطلب نهائياً؟",
 badlogin:"البريد أو كلمة المرور غير صحيحة.",noacc:"هذا الحساب ليس حساب المسؤول.",details:"التفاصيل",hide:"إخفاء",newreq:"جديد",
 rm_q:"مرحباً {name}، معك شركة عبد العزيز كروب بخصوص طلبك {ref}.",rm_a:" تمت الموافقة على طلبك.",rm_r:" للأسف لا نستطيع تنفيذ هذا الطلب.",rm_p:" عرضنا: {q}.",rm_e:" رد هنا وسنؤكد الخطوات التالية."}
};
var ORDER=["new","review","quoted","approved","rejected","done"];
var $=function(s,r){return (r||document).querySelector(s)};
var lang="en";try{lang=localStorage.getItem("afc-lang")==="ar"?"ar":"en"}catch(e){}
function tr(k){var o=T[lang];return k.split(".").reduce(function(a,b){return a&&a[b]},o)}
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("on");setTimeout(function(){t.classList.remove("on")},1800)}

var db=null,auth=null,DOCS=[],filter="all",open={},unsub=null;
function applyLang(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-i]").forEach(function(e){e.textContent=tr(e.dataset.i)});
  document.querySelectorAll("[data-ph]").forEach(function(e){e.placeholder=tr(e.dataset.ph)});
  $("#lang").textContent=lang==="ar"?"EN":"عربي";
  render();
}
$("#lang").onclick=function(){lang=lang==="ar"?"en":"ar";try{localStorage.setItem("afc-lang",lang)}catch(e){}applyLang()};
$("#theme").onclick=function(){var r=document.documentElement,cur=r.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"),n=cur==="dark"?"light":"dark";r.setAttribute("data-theme",n);try{localStorage.setItem("afc-theme",n)}catch(e){}};

function fmtDate(ts){
  var d=ts&&ts.toDate?ts.toDate():null;if(!d)return "";
  return d.toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"});
}
function digits(p){var raw=String(p||"").trim(),d=raw.replace(/[^\d]/g,"");if(d.indexOf("00")===0)return d.slice(2);if(raw.charAt(0)!=="+"&&d.charAt(0)==="0")return "963"+d.slice(1);return d}
function replyText(r){
  var m=tr("rm_q").replace("{name}",r.name||"").replace("{ref}",r.ref||"");
  if(r.status==="approved")m+=tr("rm_a");else if(r.status==="rejected")m+=tr("rm_r");
  if(r.quote)m+=tr("rm_p").replace("{q}",r.quote);
  if(r.status!=="rejected")m+=tr("rm_e");
  return m;
}
function kv(k,v){return v?'<div class="kv"><small>'+esc(tr(k))+'</small><span>'+esc(v)+'</span></div>':""}
function matches(r,q){if(!q)return true;q=q.toLowerCase();return [r.name,r.company,r.phone,r.email,r.ref,r.from,r.to,r.syrcity,r.goods,r.hscode].join(" ").toLowerCase().indexOf(q)>-1}

function render(){
  if(!$("#app")||$("#app").hidden)return;
  var counts={all:DOCS.length};ORDER.forEach(function(s){counts[s]=0});DOCS.forEach(function(d){counts[d.status||"new"]=(counts[d.status||"new"]||0)+1});
  $("#stats").innerHTML=['all'].concat(ORDER).map(function(s){
    return '<button class="chip" data-f="'+s+'" aria-pressed="'+(filter===s)+'">'+esc(s==="all"?tr("all"):tr("st."+s))+'<b>'+(counts[s]||0)+'</b></button>'}).join("");
  document.querySelectorAll(".chip").forEach(function(c){c.onclick=function(){filter=c.dataset.f;render()}});
  document.title=(counts["new"]?"("+counts["new"]+") ":"")+"Admin - Abdul Aziz Group Company";
  var q=$("#q").value.trim();
  var rows=DOCS.filter(function(d){return(filter==="all"||(d.status||"new")===filter)&&matches(d,q)});
  if(!rows.length){$("#list").innerHTML='<div class="empty">'+esc(tr("none"))+'</div>';return}
  $("#list").innerHTML=rows.map(function(r){
    var st=r.status||"new",isOpen=!!open[r.id];
    var route=esc(r.from)+" → "+esc(r.to)+(r.syrcity?" ("+esc(r.syrcity)+")":"");
    var h='<article class="card '+(st==="new"?"new":"")+'" data-id="'+esc(r.id)+'">'+
      '<div class="top"><div><div class="nm">'+esc(r.name)+(r.company?' <span class="meta">- '+esc(r.company)+'</span>':'')+'</div><div class="meta">'+esc(r.ref)+' · '+esc(fmtDate(r.createdAt))+'</div></div><span class="badge s-'+st+'">'+esc(tr("st."+st))+'</span></div>'+
      '<div class="route" dir="auto">'+route+'</div>'+
      '<div class="grid">'+kv("truck",r.svc&&({ftl:"Full truck load",ltl:"Part load",ref:"Refrigerated",flat:"Flatbed",heavy:"Heavy and oversized"}[r.svc]||r.svc))+kv("mode",r.mode==="transit"?tr("transit"):tr("inSyria"))+kv("crossing",r.border)+kv("cargo",r.cargo)+kv("hs",r.hscode)+kv("weight",r.weight)+'</div>'+
      '<div class="acts"><button class="btn sm" data-a="tog">'+esc(isOpen?tr("hide"):tr("details"))+'</button>'+
      '<a class="btn sm wa" target="_blank" rel="noopener" href="https://wa.me/'+digits(r.phone)+'?text='+encodeURIComponent(replyText(r))+'">'+esc(tr("wa"))+'</a>'+
      (r.email?'<a class="btn sm" href="mailto:'+esc(r.email)+'?subject='+encodeURIComponent(r.ref||"")+'&body='+encodeURIComponent(replyText(r))+'">'+esc(tr("mailr"))+'</a>':'')+'</div>';
    if(isOpen){
      h+='<div class="more">'+
       '<div class="grid">'+kv("phone",r.phone)+kv("mail",r.email)+kv("goods",r.goods)+kv("ready",r.date)+kv("files",r.files)+kv("notes",r.notes)+'</div>'+
       '<div class="row"><label><span>'+esc(tr("status"))+'</span><select data-f="status">'+ORDER.map(function(s){return '<option value="'+s+'"'+(s===st?' selected':'')+'>'+esc(tr("st."+s))+'</option>'}).join("")+'</select></label>'+
       '<label><span>'+esc(tr("quote"))+'</span><input data-f="quote" dir="auto" value="'+esc(r.quote||"")+'" placeholder="'+esc(tr("quote_ph"))+'"></label></div>'+
       '<label><span>'+esc(tr("anote"))+'</span><textarea rows="2" data-f="adminNote">'+esc(r.adminNote||"")+'</textarea></label>'+
       '<div class="acts"><button class="btn sm p" data-a="save">'+esc(tr("save"))+'</button><button class="btn sm ok" data-a="approve">'+esc(tr("approve"))+'</button><button class="btn sm no" data-a="reject">'+esc(tr("reject"))+'</button><button class="btn sm" data-a="copy">'+esc(tr("copy"))+'</button><span class="sp"></span><button class="btn sm no" data-a="del">'+esc(tr("del"))+'</button></div></div>';
    }
    return h+'</article>';
  }).join("");
  document.querySelectorAll(".card").forEach(function(c){
    var id=c.dataset.id;
    c.querySelectorAll("[data-a]").forEach(function(b){b.onclick=function(){act(id,b.dataset.a,c)}});
  });
}
function byId(id){return DOCS.filter(function(d){return d.id===id})[0]}
function update(id,patch,msg){
  patch.updatedAt=firebase.firestore.FieldValue.serverTimestamp();
  return db.collection("requests").doc(id).update(patch).then(function(){toast(msg||tr("saved"))}).catch(function(e){toast(e.code||"Error")});
}
function fields(c){var o={};c.querySelectorAll("[data-f]").forEach(function(e){if(e.tagName==="SELECT"||e.tagName==="INPUT"||e.tagName==="TEXTAREA")o[e.dataset.f]=e.value});return o}
function act(id,a,c){
  var r=byId(id);if(!r)return;
  if(a==="tog"){open[id]=!open[id];render();return}
  if(a==="save"){update(id,fields(c))}
  else if(a==="approve"){var f=fields(c);f.status="approved";update(id,f)}
  else if(a==="reject"){var g=fields(c);g.status="rejected";update(id,g)}
  else if(a==="copy"){try{navigator.clipboard.writeText(r.summary||"").then(function(){toast(tr("copied"))})}catch(e){}}
  else if(a==="del"){if(confirm(tr("confirm")))db.collection("requests").doc(id).delete().catch(function(e){toast(e.code||"Error")})}
}
$("#q").addEventListener("input",render);

function ld(u){return new Promise(function(res,rej){var s=document.createElement("script");s.src=u;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function start(){
  var c=window.FIREBASE_CONFIG;
  if(!c||!c.apiKey||/PASTE/.test(c.apiKey)){$("#setup").hidden=false;applyLang();return}
  var b="https://www.gstatic.com/firebasejs/10.12.2/";
  ld(b+"firebase-app-compat.js").then(function(){return ld(b+"firebase-auth-compat.js")}).then(function(){return ld(b+"firebase-firestore-compat.js")}).then(function(){
    firebase.initializeApp(c);auth=firebase.auth();db=firebase.firestore();
    auth.onAuthStateChanged(function(u){
      if(unsub){unsub();unsub=null}
      $("#login").hidden=!!u;$("#app").hidden=!u;$("#out").hidden=!u;
      if(u){
        unsub=db.collection("requests").orderBy("createdAt","desc").limit(500).onSnapshot(function(s){
          DOCS=s.docs.map(function(d){var o=d.data();o.id=d.id;return o});render();
        },function(e){
          if(e.code==="permission-denied"){$("#lerr").textContent=tr("noacc");auth.signOut()}
        });
      }
    });
  }).catch(function(){$("#setup").hidden=false});
  applyLang();
}
$("#login").addEventListener("submit",function(e){
  e.preventDefault();$("#lerr").textContent="";
  auth.signInWithEmailAndPassword($("#le").value.trim(),$("#lp").value).catch(function(){$("#lerr").textContent=tr("badlogin")});
});
$("#out").onclick=function(){auth.signOut()};
applyLang();
</script>
<script src="config.js"></script>
<script>start()</script>
</body>
</html>
